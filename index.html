<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub do Tomás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#f3ede0; --mustard:#e0a63a; --coral:#e0653f; --cream:#14181d;
  --leaf:#5c7a5e; --teal:#3d7a8c;
  --line: rgba(243,237,224,.14); --text: var(--navy); --muted: #a9a599;
  --card-bg: #1e242b; --bg: var(--cream); --danger:#a3352d;
  --warn-bg:#3a2e1c; --warn-text:#e0b878;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{
  background:var(--bg); color:var(--text); font-family:'Karla', system-ui, sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased;
  padding: max(20px, env(safe-area-inset-top)) 18px max(40px, env(safe-area-inset-bottom));
}
.wrap{max-width:480px;margin:0 auto;}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;}
.brand{font-family:'Fraunces', serif;font-weight:600;font-size:1.15rem;letter-spacing:-0.01em;}
.brand span{color:var(--coral);}
.school{font-size:.78rem;color:var(--muted);}

.tabs{display:flex;gap:4px;background:var(--card-bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;overflow-x:auto;}
@keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }
.tabs button{flex:1;min-width:0;border:none;background:transparent;color:var(--muted);font-family:'Karla',sans-serif;font-weight:600;font-size:.78rem;padding:9px 4px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .18s ease, color .18s ease;}
.tabs button.active{background:var(--navy);color:var(--cream);}
.panel{display:none;}
.panel.active{display:block; animation:fadeIn .22s ease;}

.toggle{display:flex;gap:6px;background:var(--card-bg);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:16px;}
.toggle button{flex:1;border:none;background:transparent;color:var(--muted);font-family:'Karla',sans-serif;font-weight:600;font-size:.85rem;padding:9px 0;border-radius:999px;cursor:pointer;transition:background .18s ease, color .18s ease;}
.toggle button.active{background:var(--navy);color:var(--cream);}

.warn-banner{background:var(--warn-bg);color:var(--warn-text);border-radius:12px;padding:11px 14px;font-size:.8rem;line-height:1.4;margin-bottom:14px;display:none;}
.warn-banner.show{display:block;}

.daycard{background:var(--card-bg);border:1px solid var(--line);border-radius:22px;padding:22px 20px 18px;animation:fadeIn .22s ease;}
.daylabel{font-size:.72rem;font-weight:600;color:var(--coral);text-transform:lowercase;margin-bottom:2px;}
.daytitle{font-family:'Fraunces', serif;font-weight:600;font-size:1.5rem;line-height:1.15;margin:0 0 2px;}
.daydate{font-size:.82rem;color:var(--muted);margin-bottom:18px;}
.dish{padding:13px 0;border-top:1px solid var(--line);display:flex;gap:12px;}
.dish:first-of-type{border-top:none;}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;}
.dot.sopa{background:var(--leaf);} .dot.medit{background:var(--coral);}
.dot.veg{background:var(--mustard);} .dot.salada{background:var(--leaf);} .dot.sobremesa{background:var(--muted);}
.dish-body{flex:1;min-width:0;}
.dish-kind{font-size:.72rem;font-weight:600;color:var(--muted);margin-bottom:2px;}
.dish-name{font-size:.98rem;line-height:1.35;}
.aller{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);line-height:1.5;}
.aller b{color:var(--text);font-weight:600;}
.empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:.95rem;}
.empty .big{font-family:'Fraunces',serif;font-size:1.3rem;color:var(--text);margin-bottom:6px;}

.status-line{font-size:.78rem;color:var(--muted);margin-bottom:14px;line-height:1.5;}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--navy);color:var(--cream);border:none;border-radius:14px;padding:13px;font-family:'Karla',sans-serif;font-weight:600;font-size:.9rem;cursor:pointer;margin-bottom:16px;transition:opacity .15s ease, transform .1s ease;}
.add-btn:active{opacity:.85;}

.form-card{background:var(--card-bg);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:18px;display:none;}
.form-card.open{display:block; animation:fadeIn .2s ease;}
.form-card label{display:block;font-size:.74rem;font-weight:600;color:var(--muted);margin:12px 0 5px;}
.form-card label:first-child{margin-top:0;}
.cat-row{display:flex;flex-wrap:wrap;gap:6px;}
.cat-chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.76rem;font-weight:600;cursor:pointer;color:var(--text);transition:background .15s ease, border-color .15s ease;}
.cat-chip.selected{border-color:transparent;color:#fff;}
.form-card input[type=text], .form-card input[type=date], .form-card input[type=time], .form-card select, .form-card textarea{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:'Karla',sans-serif;
  font-size:.92rem;background:var(--bg);color:var(--text);
}
.time-row{display:flex;gap:10px;}
.time-row > div{flex:1;}
.form-card textarea{resize:vertical;min-height:52px;}
.check-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
.check-row input{width:18px;height:18px;}
.check-row label{margin:0;font-size:.86rem;font-weight:600;color:var(--text);}
.form-actions{display:flex;gap:10px;margin-top:16px;}
.form-actions button{flex:1;border-radius:10px;padding:11px;font-family:'Karla',sans-serif;font-weight:600;font-size:.86rem;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);}
.form-actions .save{background:var(--navy);color:var(--cream);border-color:var(--navy);}
.form-actions .del{color:var(--danger);border-color:var(--danger);}
.form-err{color:var(--danger);font-size:.78rem;margin-top:8px;display:none;}

.group-label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px;}
.group-label:first-child{margin-top:0;}
.ev-card{background:var(--card-bg);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;display:flex;gap:11px;cursor:default;animation:fadeIn .2s ease;}
.ev-card.editable{cursor:pointer;}
.ev-bar{width:4px;border-radius:4px;flex:none;}
.ev-body{flex:1;min-width:0;}
.ev-cat{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px;}
.ev-title{font-size:.94rem;font-weight:600;line-height:1.3;}
.ev-when{font-size:.78rem;color:var(--muted);margin-top:2px;}
.ev-notes{font-size:.8rem;color:var(--muted);margin-top:4px;line-height:1.4;}
.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;margin-top:5px;}
.badge.urgent{background:var(--danger);color:#fff;}
.badge.soon{background:var(--mustard);color:#4a3208;}
.badge.done{background:var(--leaf);color:#fff;}

.past-toggle{background:transparent;border:none;color:var(--muted);font-size:.8rem;font-family:'Karla',sans-serif;text-decoration:underline;padding:8px 0;cursor:pointer;}

.timeline{position:relative; margin-left:44px; border-left:1px solid var(--line);}
.tl-hour{position:absolute; left:-44px; width:38px; text-align:right; font-size:.68rem; color:var(--muted); transform:translateY(-6px);}
.tl-block{position:absolute; left:8px; right:0; background:var(--card-bg); border:1px solid var(--line); border-left:3px solid var(--teal); border-radius:8px; padding:6px 10px; overflow:hidden; cursor:pointer;}
.tl-block .tl-time{font-size:.66rem; color:var(--muted); font-weight:600;}
.tl-block .tl-subject{font-size:.86rem; font-weight:600; line-height:1.25;}
.tl-free{position:absolute; left:8px; right:0; display:flex; align-items:center; padding-left:10px; border-radius:8px; border:1px dashed var(--line); color:var(--muted); font-size:.72rem;}
footer{text-align:center;margin-top:22px;font-size:.72rem;color:var(--muted);}

.next-up{background:var(--navy);color:var(--cream);border-radius:18px;padding:18px 20px;margin-bottom:18px;}
.next-up .nu-label{font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.65;margin-bottom:6px;}
.next-up .nu-title{font-family:'Fraunces',serif;font-weight:600;font-size:1.2rem;line-height:1.25;}
.next-up .nu-when{font-size:.82rem;opacity:.8;margin-top:4px;}
.next-up.empty .nu-title{font-size:1rem; font-family:'Karla',sans-serif; font-weight:600; opacity:.8;}

.day-summary{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-bottom:10px;}
.day-summary .ds-label{font-size:.72rem;font-weight:600;color:var(--coral);text-transform:lowercase;margin-bottom:8px;}
.day-summary.today .ds-label{color:var(--leaf);}
.ds-item{display:flex;gap:10px;padding:6px 0;font-size:.86rem;}
.ds-item .ds-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:none;}
.ds-item .ds-text{flex:1;}
.ds-item .ds-time{color:var(--muted);font-size:.76rem;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Hub <span>Tomás</span></div>
    <div class="school">São João da Madeira</div>
  </header>

  <div class="tabs">
    <button id="tabHoje" class="active">Hoje</button>
    <button id="tabEmenta">Ementa</button>
    <button id="tabHorario">Horário</button>
    <button id="tabAgenda">Agenda</button>
    <button id="tabAnos">Anos</button>
  </div>

  <!-- HOJE / SEMANA -->
  <div id="panelHojeResumo" class="panel active">
    <div class="toggle">
      <button id="btnResumoHoje" class="active">Hoje</button>
      <button id="btnResumoSemana">Semana</button>
    </div>
    <div id="aSeguirBox"></div>
    <div id="resumoContent"></div>
  </div>

  <!-- EMENTA -->
  <div id="panelEmenta" class="panel">
    <div id="ementaWarn" class="warn-banner"></div>
    <div class="toggle">
      <button id="btnHoje">Hoje</button>
      <button id="btnAmanha" class="active">Amanhã</button>
    </div>
    <div id="ementaContent"></div>
    <footer>Toca em "Hoje" ou "Amanhã" · dados da Uniself</footer>
  </div>

  <!-- HORARIO -->
  <div id="panelHorario" class="panel">
    <div id="horarioStatus" class="status-line"></div>
    <button id="addHorarioBtn" class="add-btn" style="display:none;">+ Adicionar aula</button>

    <div class="toggle" id="dayToggle">
      <button data-day="Segunda">Seg</button>
      <button data-day="Terça">Ter</button>
      <button data-day="Quarta">Qua</button>
      <button data-day="Quinta">Qui</button>
      <button data-day="Sexta">Sex</button>
    </div>

    <div id="horarioForm" class="form-card">
      <label>Dia</label>
      <select id="hDay">
        <option value="Segunda">Segunda</option>
        <option value="Terça">Terça</option>
        <option value="Quarta">Quarta</option>
        <option value="Quinta">Quinta</option>
        <option value="Sexta">Sexta</option>
      </select>
      <label>Hora</label>
      <div class="time-row">
        <div><input type="time" id="hStart"></div>
        <div><input type="time" id="hEnd"></div>
      </div>
      <label>Disciplina</label>
      <input type="text" id="hSubject" placeholder="Matemática, Educação Física...">
      <div class="form-err" id="hErr"></div>
      <div class="form-actions">
        <button id="hCancel">Cancelar</button>
        <button id="hDelete" class="del" style="display:none;">Apagar</button>
        <button id="hSave" class="save">Guardar</button>
      </div>
    </div>

    <div id="horarioList"></div>
  </div>

  <!-- AGENDA -->
  <div id="panelAgenda" class="panel">
    <div id="hoqueiWarn" class="warn-banner"></div>
    <div id="agendaStatus" class="status-line"></div>
    <button id="addBtn" class="add-btn" style="display:none;">+ Adicionar evento</button>

    <div id="formCard" class="form-card">
      <label>Categoria</label>
      <div id="catRow" class="cat-row"></div>
      <label>Título</label>
      <input type="text" id="fTitle" placeholder="Treino, jogo, aula, teste...">
      <label>Data</label>
      <input type="date" id="fDate">
      <label>Hora (opcional)</label>
      <div class="time-row">
        <div><input type="time" id="fStart"></div>
        <div><input type="time" id="fEnd"></div>
      </div>
      <label>Notas (opcional)</label>
      <textarea id="fNotes" placeholder="Local, adversário, o que é preciso levar..."></textarea>

      <div id="gameFields" style="display:none;">
        <label>Tipo de jogo</label>
        <div class="cat-row" id="gameTypeRow">
          <button type="button" class="cat-chip" data-type="treino">Treino</button>
          <button type="button" class="cat-chip" data-type="campeonato">Campeonato</button>
        </div>
        <label>Resultado (depois do jogo)</label>
        <div class="time-row">
          <div><input type="number" id="fScoreUs" min="0" placeholder="ELA"></div>
          <div><input type="number" id="fScoreThem" min="0" placeholder="Adversário"></div>
        </div>
        <label>Golos do Tomás</label>
        <input type="number" id="fTomasGoals" min="0" placeholder="0">
      </div>

      <div class="form-err" id="formErr"></div>
      <div class="form-actions">
        <button id="fCancel">Cancelar</button>
        <button id="fDelete" class="del" style="display:none;">Apagar</button>
        <button id="fSave" class="save">Guardar</button>
      </div>
    </div>

    <div id="eventsList"></div>
  </div>

  <!-- ANIVERSARIOS -->
  <div id="panelAnos" class="panel">
    <div id="anosWarn" class="warn-banner"></div>
    <div id="anosStatus" class="status-line"></div>
    <button id="addAnoBtn" class="add-btn" style="display:none;">+ Adicionar aniversário</button>

    <div id="anoForm" class="form-card">
      <label>Nome do colega</label>
      <input type="text" id="aName" placeholder="Nome">
      <label>Data de nascimento (o ano não importa, é só para escolheres dia e mês)</label>
      <input type="date" id="aBirth">
      <label>Data da festa este ano, se for diferente (opcional)</label>
      <input type="date" id="aParty">
      <label>Este ano há festa? Responder até (opcional)</label>
      <input type="date" id="aRsvp">
      <label>Notas (opcional)</label>
      <textarea id="aNotes" placeholder="Local, prenda, contacto dos pais..."></textarea>
      <div class="check-row">
        <input type="checkbox" id="aResponded">
        <label for="aResponded">Já respondi</label>
      </div>
      <div class="form-err" id="aErr"></div>
      <div class="form-actions">
        <button id="aCancel">Cancelar</button>
        <button id="aDelete" class="del" style="display:none;">Apagar</button>
        <button id="aSave" class="save">Guardar</button>
      </div>
    </div>

    <div id="anosList"></div>
  </div>
</div>

function fromYMD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function toYMD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function findMenu(date){
  const weekday = date.getDay();
  if(weekday===0 || weekday===6) return {weekend:true};
  const dow = weekday-1;
  for(const w of WEEKS){
    const start = fromYMD(w.start);
    const diff = Math.round((stripTime(date)-stripTime(start))/86400000);
    if(diff>=0 && diff<5) return {day:w.days[dow], dow};
  }
  return {noData:true};
}

function collectionRef(table){
  function afterWrite(res){ if(res.error) throw res.error; return res; }
  return {
    orderBy(field){
      return {
        onSnapshot(onData, onError){
          async function load(){
            const { data, error } = await sb.from(table).select('*').order(field);
            if(error){ onError && onError(error); return; }
            onData({ docs: (data||[]).map(row => ({ id: row.id, data: ()=>row })) });
          }
          load();
          sb.channel('rt-'+table)
            .on('postgres_changes', { event:'*', schema:'public', table }, load)
            .subscribe();
        }
      };
    },
    add: (body)=> sb.from(table).insert(body).then(afterWrite),
    doc(id){
      return {
        update: (body)=> sb.from(table).update(body).eq('id', id).then(afterWrite),
        delete: ()=> sb.from(table).delete().eq('id', id).then(afterWrite)
      };
    }
  };
}
function docRef(path){
  const [table, id] = path.split('/');
  return {
    get: async ()=>{
      const { data, error } = await sb.from(table).select('*').eq('id', id).maybeSingle();
      if(error) throw error;
      return { exists: !!data, data: ()=> data || {} };
    },
    set: async (body)=>{
      const { error } = await sb.from(table).upsert({ id, ...body });
      if(error) throw error;
    },
    onSnapshot(onData, onError){
      async function load(){
        try {
          const { data, error } = await sb.from(table).select('*').eq('id', id).maybeSingle();
          if(error) throw error;
          onData({ exists: !!data, data: ()=> data || {} });
        } catch(e){ onError && onError(e); }
      }
      load();
      sb.channel('rt-'+table)
        .on('postgres_changes', { event:'*', schema:'public', table }, load)
        .subscribe();
    }
  };
}

    let current = fresh.exists ? (fresh.data().slots || []) : [];
    if(editingSlotId){
      current = current.map(s => s.id===editingSlotId ? { ...s, day:hDay.value, start:hStart.value, end:hEnd.value, subject } : s);
    } else {
      current.push({ id:newId(), day:hDay.value, start:hStart.value, end:hEnd.value, subject });
    }
    await db.doc('schedule/main').set({ slots: current });
    closeHorarioForm();
  } catch(e){
    if(e && e.code === 'invalid_argument'){ canWrite = false; renderHorarioStatus(); hErr.textContent='Não tens permissão para editar.'; }
    else { hErr.textContent='Não foi possível guardar.'; }
    hErr.style.display='block';
  } finally { hSave.disabled = false; }
});
hDelete.addEventListener('click', async ()=>{
  if(!editingSlotId) return;
  hDelete.disabled = true;
  try {
    const fresh = await db.doc('schedule/main').get();
    let current = fresh.exists ? (fresh.data().slots || []) : [];
    current = current.filter(s=>s.id!==editingSlotId);
    await db.doc('schedule/main').set({ slots: current });
    closeHorarioForm();
  } catch(e){ hErr.textContent='Não foi possível apagar.'; hErr.style.display='block'; }
  finally { hDelete.disabled = false; }
});
const DAY_START = 8*60, DAY_END = 18*60+15; // 08:00–18:15, cobre o horário todo
const PX_PER_MIN = 1.15;
function toMin(hhmm){ const [h,m]=hhmm.split(':').map(Number); return h*60+m; }
function fmtDur(min){
  if(min < 60) return `${min} min`;
  const h = Math.floor(min/60), m = min%60;
  return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}
function renderHorario(){
  const daySlots = slots.filter(s=>s.day===selectedDay).sort((a,b)=>a.start.localeCompare(b.start));
  if(slots.length === 0){ horarioList.innerHTML = `<div class="empty"><div class="big">Sem horário</div>adiciona a primeira aula fixa</div>`; return; }
  if(daySlots.length === 0){ horarioList.innerHTML = `<div class="empty"><div class="big">Dia livre</div>sem aulas marcadas para ${selectedDay.toLowerCase()}-feira</div>`; return; }

  const totalH = (DAY_END - DAY_START) * PX_PER_MIN;
  let html = `<div class="timeline" style="height:${totalH}px">`;

  for(let h = Math.ceil(DAY_START/60); h <= Math.floor(DAY_END/60); h++){
    html += `<div class="tl-hour" style="top:${(h*60-DAY_START)*PX_PER_MIN}px">${h}:00</div>`;
  }

  let cursor = DAY_START;
  daySlots.forEach(s=>{
    const start = toMin(s.start), end = toMin(s.end);
    if(start > cursor + 25){
      const gapTop = (cursor-DAY_START)*PX_PER_MIN, gapH = (start-cursor)*PX_PER_MIN;
      html += `<div class="tl-free" style="top:${gapTop}px; height:${gapH}px;">Livre · ${fmtDur(start-cursor)}</div>`;
    }
    const top = (start-DAY_START)*PX_PER_MIN, h = Math.max((end-start)*PX_PER_MIN, 30);
    html += `<div class="tl-block" data-id="${s.id}" style="top:${top}px; height:${h}px;">
      <div class="tl-time">${s.start}–${s.end}</div>
      <div class="tl-subject">${escapeHtml(s.subject)}</div>
    </div>`;
    cursor = Math.max(cursor, end);
  });
  if(cursor < DAY_END - 25){
    const gapTop = (cursor-DAY_START)*PX_PER_MIN, gapH = (DAY_END-cursor)*PX_PER_MIN;
    html += `<div class="tl-free" style="top:${gapTop}px; height:${gapH}px;">Livre · ${fmtDur(DAY_END-cursor)}</div>`;
  }
  html += `</div>`;
  horarioList.innerHTML = html;

  if(canWrite){
    horarioList.querySelectorAll('.tl-block').forEach(card=>{
      card.addEventListener('click', ()=>{ const s = slots.find(x=>x.id===card.dataset.id); if(s) openHorarioForm(s); });
    });
  }
}
function renderHorarioStatus(){
  if(!db){ horarioStatus.textContent = 'O horário partilhado só funciona aberto a partir do Claude, com sessão iniciada.'; addHorarioBtn.style.display='none'; return; }
  addHorarioBtn.style.display = canWrite ? 'flex' : 'none';
  horarioStatus.textContent = canWrite ? 'Horário fixo semanal — edita quando mudar.' : 'Modo leitura.';
}
function subscribeHorario(){
  db.doc('schedule/main').onSnapshot(
    (snap)=>{ slots = snap.exists ? (snap.data().slots || []) : []; renderHorario(); renderResumo(); },
    ()=>{ horarioStatus.textContent = 'Não foi possível carregar o horário.'; }
  );
}

/* ---------------- ANIVERSARIOS ---------------- */
const anosStatus = document.getElementById('anosStatus');
const addAnoBtn = document.getElementById('addAnoBtn');
const anoForm = document.getElementById('anoForm');
const anosList = document.getElementById('anosList');
const aName = document.getElementById('aName');
const aBirth = document.getElementById('aBirth');
const aParty = document.getElementById('aParty');
const aRsvp = document.getElementById('aRsvp');
const aNotes = document.getElementById('aNotes');
const aResponded = document.getElementById('aResponded');
const aErr = document.getElementById('aErr');
const aSave = document.getElementById('aSave');
const aCancel = document.getElementById('aCancel');
const aDelete = document.getElementById('aDelete');
let allBirthdays = [];
let editingAnoId = null;

function openAnoForm(prefill){
  aErr.style.display='none';
  if(prefill){
    editingAnoId = prefill.id;
    aName.value = prefill.name || ''; aBirth.value = prefill.birthDate || ''; aParty.value = prefill.partyDate || ''; aRsvp.value = prefill.rsvpBy || '';
    aNotes.value = prefill.notes || ''; aResponded.checked = !!prefill.responded;
    aDelete.style.display = 'block';
  } else {
    editingAnoId = null;
    aName.value=''; aBirth.value=''; aParty.value=''; aRsvp.value=''; aNotes.value=''; aResponded.checked=false;
    aDelete.style.display = 'none';
  }
  anoForm.classList.add('open');
  anoForm.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function closeAnoForm(){ anoForm.classList.remove('open'); editingAnoId = null; }
addAnoBtn.addEventListener('click', ()=>openAnoForm(null));
aCancel.addEventListener('click', closeAnoForm);
aSave.addEventListener('click', async ()=>{
  const name = aName.value.trim();
  if(!name){ aErr.textContent='Falta o nome.'; aErr.style.display='block'; return; }
  if(!aBirth.value){ aErr.textContent='Falta a data de nascimento.'; aErr.style.display='block'; return; }
  const body = { name, birthDate: aBirth.value, partyDate: aParty.value||'', rsvpBy: aRsvp.value||'', notes: aNotes.value.trim(), responded: aResponded.checked };
  aSave.disabled = true;
  try {
    if(editingAnoId){ await db.collection('birthdays').doc(editingAnoId).update(body); }
    else { body.createdAt = new Date().toISOString(); await db.collection('birthdays').add(body); }
    closeAnoForm();
  } catch(e){
    if(e && e.code === 'invalid_argument'){ canWrite = false; renderAnosStatus(); aErr.textContent='Não tens permissão para editar.'; }
    else { aErr.textContent='Não foi possível guardar.'; }
    aErr.style.display='block';
  } finally { aSave.disabled = false; }
});
aDelete.addEventListener('click', async ()=>{
  if(!editingAnoId) return;
  aDelete.disabled = true;
  try { await db.collection('birthdays').doc(editingAnoId).delete(); closeAnoForm(); }
  catch(e){ aErr.textContent='Não foi possível apagar.'; aErr.style.display='block'; }
  finally { aDelete.disabled = false; }
});
let showAllAnos = false;
function nextOccurrence(dateStr){
  const d = fromYMD(dateStr);
  const today = stripTime(new Date());
  let next = new Date(today.getFullYear(), d.getMonth(), d.getDate());
  if(next < today) next.setFullYear(today.getFullYear()+1);
  return next;
}
function anoCardHtml(a, today){
  const daysTo = Math.round((a._next - today)/86400000);
  let bBadge = '';
  if(daysTo===0) bBadge = `<span class="badge soon">Hoje!</span>`;
  else if(daysTo===1) bBadge = `<span class="badge soon">Amanhã</span>`;
  else if(daysTo<=7) bBadge = `<span class="badge soon">Esta semana</span>`;
  let rBadge = '';
  if(a.rsvpBy){
    if(a.responded) rBadge = `<span class="badge done">Respondido</span>`;
    else {
      const daysRsvp = Math.round((fromYMD(a.rsvpBy)-today)/86400000);
      if(daysRsvp < 0) rBadge = `<span class="badge urgent">Prazo passou</span>`;
      else if(daysRsvp <= 3) rBadge = `<span class="badge soon">Responder até ${fromYMD(a.rsvpBy).getDate()} ${MESES[fromYMD(a.rsvpBy).getMonth()]}</span>`;
    }
  }
  const partyLine = a.partyDate ? ` · festa: ${fromYMD(a.partyDate).getDate()} ${MESES[fromYMD(a.partyDate).getMonth()]}` : '';
  const rsvpLine = a.rsvpBy ? ` · responder até ${fromYMD(a.rsvpBy).getDate()} ${MESES[fromYMD(a.rsvpBy).getMonth()]}` : '';
  return `<div class="ev-card${canWrite?' editable':''}" data-id="${a.id}">
    <div class="ev-bar" style="background:var(--coral)"></div>
    <div class="ev-body">
      <div class="ev-title">${escapeHtml(a.name)}</div>
      <div class="ev-when">Nasceu a ${a._next.getDate()} ${MESES[a._next.getMonth()]}${partyLine}${rsvpLine}</div>
      ${a.notes ? `<div class="ev-notes">${escapeHtml(a.notes)}</div>` : ''}
      ${bBadge}${rBadge}
    </div>
  </div>`;
}
function renderAnos(){
  const today = stripTime(new Date());
  const withNext = allBirthdays.map(a => ({...a, _next: nextOccurrence(a.birthDate)}));
  const sorted = withNext.sort((a,b)=> a._next - b._next);
  const thisWeek = sorted.filter(a => {
    const dBirth = Math.round((a._next-today)/86400000);
    const birthSoon = dBirth>=0 && dBirth<=7;
    let partySoon = false;
    if(a.partyDate){
      const dParty = Math.round((fromYMD(a.partyDate)-today)/86400000);
      partySoon = dParty>=0 && dParty<=7;
    }
    return birthSoon || partySoon;
  });

  let html = '';
  if(thisWeek.length){
    html += `<div class="group-label">Esta semana</div>` + thisWeek.map(a=>anoCardHtml(a, today)).join('');
  } else {
    html += `<div class="empty"><div class="big">Ninguém esta semana</div>os aniversários aparecem aqui na própria semana</div>`;
  }
  html += `<button class="past-toggle" id="anosToggleAll">${showAllAnos ? 'Ocultar lista completa' : `Gerir todos (${sorted.length})`}</button>`;
  if(showAllAnos){
    html += sorted.map(a=>anoCardHtml(a, today)).join('');
  }
  anosList.innerHTML = html;

  const t = document.getElementById('anosToggleAll');
  if(t) t.addEventListener('click', ()=>{ showAllAnos = !showAllAnos; renderAnos(); });

  if(canWrite){
    anosList.querySelectorAll('.ev-card').forEach(card=>{
      card.addEventListener('click', ()=>{ const a = allBirthdays.find(x=>x.id===card.dataset.id); if(a) openAnoForm(a); });
    });
  }
  anosWarnUpdate(thisWeek);
}
function anosWarnUpdate(soon){
  const warn = document.getElementById('anosWarn');
  if(!soon.length){ warn.classList.remove('show'); return; }
  warn.classList.add('show');
  warn.textContent = 'Esta semana: ' + soon.map(a=>{
    const daysTo = Math.round((a._next-stripTime(new Date()))/86400000);
    const when = daysTo===0 ? 'hoje' : daysTo===1 ? 'amanhã' : `dia ${a._next.getDate()}`;
    return `${a.name} (${when})`;
  }).join(', ');
}
function renderAnosStatus(){
  if(!db){ anosStatus.textContent = 'Só funciona aberto a partir do Claude, com sessão iniciada.'; addAnoBtn.style.display='none'; return; }
  addAnoBtn.style.display = canWrite ? 'flex' : 'none';
  anosStatus.textContent = canWrite ? 'Regista o convite assim que ele chegar.' : 'Modo leitura.';
}
function subscribeAnos(){
  db.collection('birthdays').orderBy('partyDate').onSnapshot(
    (snap)=>{ allBirthdays = snap.docs.map(d=>({id:d.id, ...d.data()})); renderAnos(); },
    ()=>{ anosStatus.textContent = 'Não foi possível carregar.'; }
  );
}

/* ---------------- HOJE / SEMANA (resumo do dia) ---------------- */
const aSeguirBox = document.getElementById('aSeguirBox');
const resumoContent = document.getElementById('resumoContent');
const btnResumoHoje = document.getElementById('btnResumoHoje');
const btnResumoSemana = document.getElementById('btnResumoSemana');
let resumoView = 'hoje';
btnResumoHoje.addEventListener('click', ()=>{ resumoView='hoje'; btnResumoHoje.classList.add('active'); btnResumoSemana.classList.remove('active'); renderResumo(); });
btnResumoSemana.addEventListener('click', ()=>{ resumoView='semana'; btnResumoSemana.classList.add('active'); btnResumoHoje.classList.remove('active'); renderResumo(); });

// Feriados e interrupções letivas — afetam se aparecem "Aulas" no resumo do dia.
// Nacionais: afetam sempre. SJM (município da escola, 11 de outubro): afeta a escola.
// Interrupções letivas: dadas pelo João, afetam a escola. (O hóquei segue o calendário do
// clube em Oliveira de Azeméis, à parte — por isso não é tocado aqui.)
const FERIADOS_NACIONAIS = {
  "2026-10-05":"Implantação da República", "2026-11-01":"Todos os Santos",
  "2026-12-01":"Restauração da Independência", "2026-12-08":"Imaculada Conceição",
  "2026-12-25":"Natal", "2027-01-01":"Ano Novo", "2027-03-26":"Sexta-feira Santa",
  "2027-03-28":"Páscoa", "2027-04-25":"Dia da Liberdade", "2027-05-01":"Dia do Trabalhador",
  "2027-05-27":"Corpo de Deus", "2027-06-10":"Dia de Portugal"
};
const INTERRUPCOES_LETIVAS = [
  ["2026-11-11","2026-11-13","Interrupção letiva"],
  ["2026-12-22","2026-12-31","Interrupção letiva (Natal)"],
  ["2027-02-01","2027-02-05","Interrupção letiva"],
  ["2027-02-08","2027-02-09","Interrupção letiva (Carnaval)"],
  ["2027-03-22","2027-04-02","Interrupção letiva (Páscoa)"]
];
function schoolOffInfo(dateObj){
  const s = toYMD(dateObj);
  if(FERIADOS_NACIONAIS[s]) return FERIADOS_NACIONAIS[s];
  if(dateObj.getMonth()===9 && dateObj.getDate()===11) return "Feriado municipal (São João da Madeira)";
  for(const [a,b,nome] of INTERRUPCOES_LETIVAS){ if(s>=a && s<=b) return nome; }
  return null;
}

// Blocos de aulas do dia, juntando tempos seguidos e só separando em pausas a sério (>=25min) —
// mesma regra usada na timeline do Horário, para as duas vistas baterem certo.
function classBlocksForDay(dayName){
  const daySlots = slots.filter(s=>s.day===dayName).sort((a,b)=>a.start.localeCompare(b.start));
  const blocks = [];
  daySlots.forEach(s=>{
    const start = toMin(s.start), end = toMin(s.end);
    const last = blocks[blocks.length-1];
    if(last && start - last.endMin < 25){
      last.end = s.end; last.endMin = Math.max(last.endMin, end);
    } else {
      blocks.push({ start:s.start, end:s.end, endMin:end });
    }
  });
  return blocks;
}

// Junta aulas + eventos da agenda de um dia, ordenados por hora, num formato comum
function dayAgenda(dateObj){
  const dow = dateObj.getDay();
  const items = [];
  const feriado = schoolOffInfo(dateObj);
  if(feriado){
    items.push({ kind:'feriado', label:feriado, start:'', end:'', color:'var(--mustard)' });
  } else if(dow>=1 && dow<=5){
    classBlocksForDay(DIAS[dow-1]).forEach(b=>{
      items.push({ kind:'aulas', label:'Aulas', start:b.start, end:b.end, color:'var(--teal)' });
    });
  }
  const dateStr = toYMD(dateObj);
  allEvents.filter(e=>e.date===dateStr).forEach(e=>{
    const cat = CATEGORIES[e.category] || CATEGORIES.outro;
    items.push({ kind:'evento', label:e.title, start:e.startTime||'', end:e.endTime||'', color:cat.color, catLabel:cat.label });
  });
  items.sort((a,b)=> (a.start||'99:99').localeCompare(b.start||'99:99'));
  return items;
}

function itemText(it){
  if(it.kind==='feriado') return it.label;
  if(it.kind==='aulas') return `Aulas${it.start?` · ${it.start}–${it.end}`:''}`;
  const when = it.start ? (it.end ? ` · ${it.start}–${it.end}` : ` · ${it.start}`) : '';
  return `${it.label}${when}`;
}

function renderNextUp(){
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  for(let i=0;i<8;i++){
    const d = new Date(now); d.setDate(now.getDate()+i);
    const items = dayAgenda(d).filter(it=>it.start);
    for(const it of items){
      const startMin = toMin(it.start);
      if(i>0 || startMin > nowMin){
        const dayLabel = i===0 ? 'hoje' : i===1 ? 'amanhã' : `${DIAS_CURTO[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}`;
        aSeguirBox.innerHTML = `<div class="next-up">
          <div class="nu-label">A seguir</div>
          <div class="nu-title">${it.kind==='aulas' ? 'Aulas' : escapeHtml(it.label)}</div>
          <div class="nu-when">${dayLabel} · ${it.start}${it.end?`–${it.end}`:''}</div>
        </div>`;
        return;
      }
    }
  }
  aSeguirBox.innerHTML = `<div class="next-up empty"><div class="nu-label">A seguir</div><div class="nu-title">Nada marcado nos próximos dias</div></div>`;
}

function renderResumo(){
  renderNextUp();
  if(resumoView==='hoje'){
    const items = dayAgenda(new Date());
    if(items.length===0){
      resumoContent.innerHTML = `<div class="empty"><div class="big">Dia livre</div>sem aulas nem eventos marcados para hoje</div>`;
      return;
    }
    resumoContent.innerHTML = `<div class="day-summary today"><div class="ds-label">hoje</div>` +
      items.map(it=>`<div class="ds-item"><div class="ds-dot" style="background:${it.color}"></div><div class="ds-text">${escapeHtml(itemText(it))}</div></div>`).join('') +
      `</div>`;
  } else {
    let html = '';
    for(let i=0;i<7;i++){
      const d = new Date(); d.setDate(d.getDate()+i);
      const items = dayAgenda(d);
      const dowFull = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'][d.getDay()];
      const dayLabel = i===0 ? 'hoje' : i===1 ? 'amanhã' : `${dowFull}, ${d.getDate()} ${MESES[d.getMonth()]}`;
      html += `<div class="day-summary${i===0?' today':''}"><div class="ds-label">${dayLabel}</div>`;
      if(items.length===0){
        html += `<div class="ds-item"><div class="ds-text" style="color:var(--muted)">Livre</div></div>`;
      } else {
        html += items.map(it=>`<div class="ds-item"><div class="ds-dot" style="background:${it.color}"></div><div class="ds-text">${escapeHtml(itemText(it))}</div></div>`).join('');
      }
      html += `</div>`;
    }
    resumoContent.innerHTML = html;
  }
}

renderAgendaStatus(); renderHorarioStatus(); renderAnosStatus();

  document.getElementById('horarioStatus').textContent = msg;
  document.getElementById('anosStatus').textContent = msg;
} else {

}
